{% extends "base.html" %}
{% block title %}Order Confirmed{% endblock %}
{% block content %}
    <div style="text-align: center; padding: 2rem 0;">
        <div style="font-size: 3rem;">&#9989;</div>
        <h1>Thank you for your order!</h1>
        <p style="color: #555;">Your order <strong>#{{ order.id }}</strong> has been placed.</p>
        <p style="color: #555;">Total charged (not really): <strong>${{ "%.2f"|format(order.total) }}</strong></p>
        <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem; justify-content: center;">
            <a href="{{ url_for('orders.order_detail', id=order.id) }}"
               style="display: inline-block; padding: 0.6rem 1.2rem; border: 1px solid #aaa; border-radius: 4px; text-decoration: none; color: #333;">
                View Order
            </a>
            <a href="{{ url_for('main.index') }}"
               style="display: inline-block; padding: 0.6rem 1.2rem; background: #222; color: #fff; text-decoration: none; border-radius: 4px;">
                Continue Shopping
            </a>
        </div>
    </div>
{% endblock %}
